name: Ping Render

on:
  schedule:
    # Corre cada 10 minutos
    - cron: "*/10 * * * *"
  workflow_dispatch: # para correrlo manualmente si queres

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Primer ping (despierta)
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://proyectoviajes.onrender.com/health/ || true

      - name: Esperar 20 segundos
        run: sleep 20

      - name: Segundo ping (confirma)
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://proyectoviajes.onrender.com/health/)
          echo "Codigo de respuesta: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "El backend no respondio 200 despues de despertarlo"
            exit 1
          fi
